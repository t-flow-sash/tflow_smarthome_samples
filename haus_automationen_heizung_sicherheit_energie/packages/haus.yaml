      started_at: '{{ trigger.event.data.started_at if trigger.platform == ''event'' and trigger.event.event_type
        == ''demo_camera_continue'' else now().isoformat() }}'
      base_index: '{{ trigger.event.data.next_index | int(0) if trigger.platform == ''event'' and trigger.event.event_type
        == ''demo_camera_continue'' else 0 }}'
  - wait_template: '{{ states(''camera.beispiel_zone_06'') not in [''unknown'',''unavailable''] or not is_state(''input_boolean.demo_sicherheit_freigabe'',''on'')
      or not is_state(''switch.beispiel_zone_06_aufnahme'',''on'') or not (is_state(''binary_sensor.beispiel_zone_06_person'',''on'')
      or is_state(''binary_sensor.beispiel_zone_06_tier'',''on'')) }}'
    timeout: 00:00:30
    continue_on_timeout: true
  - repeat:
      count: 100
      sequence:
      - choose:
        - conditions: '{{ is_state(''input_boolean.demo_sicherheit_freigabe'',''on'') and is_state(''switch.beispiel_zone_06_aufnahme'',''on'')
            and (is_state(''binary_sensor.beispiel_zone_06_person'',''on'') or is_state(''binary_sensor.beispiel_zone_06_tier'',''on''))
            and states(''camera.beispiel_zone_06'') not in [''unknown'',''unavailable''] }}'
          sequence:
          - action: camera.snapshot
            target:
              entity_id: camera.beispiel_zone_06
            data:
              filename: /media/demo_camera/zone_06/{{ now().strftime("%Y%m%dT%H%M%S%f") }}_{{ episode_id }}_{{ base_index
                | int + repeat.index }}.jpg
            continue_on_error: true
          - delay: 00:00:05
        default:
        - variables:
            reason: '{{ ''recording_disabled'' if not is_state(''input_boolean.demo_sicherheit_freigabe'',''on'')
              or not is_state(''switch.beispiel_zone_06_aufnahme'',''on'') else ''detection_ended'' if not (is_state(''binary_sensor.beispiel_zone_06_person'',''on'')
              or is_state(''binary_sensor.beispiel_zone_06_tier'',''on'')) else ''camera_unavailable'' }}'
            ended_at: '{{ now().isoformat() }}'
            snapshot_count: '{{ base_index | int + repeat.index - 1 }}'
        - action: rest_command.demo_camera_finished
          data:
            camera: zone_06
            episode_id: '{{ episode_id }}'
            started_at: '{{ started_at }}'
            ended_at: '{{ ended_at }}'
            reason: '{{ reason }}'
            snapshot_count: '{{ snapshot_count | int }}'
        - stop: Episode abgeschlossen
  - choose:
    - conditions: '{{ is_state(''input_boolean.demo_sicherheit_freigabe'',''on'') and is_state(''switch.beispiel_zone_06_aufnahme'',''on'')
        and (is_state(''binary_sensor.beispiel_zone_06_person'',''on'') or is_state(''binary_sensor.beispiel_zone_06_tier'',''on''))
        and states(''camera.beispiel_zone_06'') not in [''unknown'',''unavailable''] }}'
      sequence:
      - event: demo_camera_continue
        event_data:
          camera: zone_06
          episode_id: '{{ episode_id }}'
          started_at: '{{ started_at }}'
          next_index: '{{ base_index | int + 100 }}'
    default:
    - variables:
        reason: '{{ ''recording_disabled'' if not is_state(''input_boolean.demo_sicherheit_freigabe'',''on'') or
          not is_state(''switch.beispiel_zone_06_aufnahme'',''on'') else ''detection_ended'' if not (is_state(''binary_sensor.beispiel_zone_06_person'',''on'')
          or is_state(''binary_sensor.beispiel_zone_06_tier'',''on'')) else ''camera_unavailable'' }}'
        ended_at: '{{ now().isoformat() }}'
        snapshot_count: '{{ base_index | int + 100 }}'
    - action: rest_command.demo_camera_finished
      data:
        camera: zone_06
        episode_id: '{{ episode_id }}'
        started_at: '{{ started_at }}'
        ended_at: '{{ ended_at }}'
        reason: '{{ reason }}'
        snapshot_count: '{{ snapshot_count | int }}'
- id: public_wallbox_freigabe
  alias: Demo wallbox freigabe
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.beispiel_angeschlossen
  - trigger: state
    entity_id: binary_sensor.demo_preis_guenstig
  - trigger: state
    entity_id: sensor.beispiel_ladestatus
  - trigger: state
    entity_id: person.beispiel_a
  - trigger: state
    entity_id: person.beispiel_b
  - trigger: time_pattern
    minutes: /5
  - trigger: homeassistant
    event: start
  actions:
  - condition: state
    entity_id: input_boolean.demo_laden_freigabe
    state: 'on'
  - choose:
    - conditions: '{{ is_state(''binary_sensor.beispiel_angeschlossen'',''on'') and (is_state(''person.beispiel_a'',''home'')
        or is_state(''person.beispiel_b'',''home'')) and (is_state(''binary_sensor.demo_preis_guenstig'',''on'')
        or is_state(''sensor.beispiel_ladestatus'',''charging'')) }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.beispiel_wallbox_freigabe
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.beispiel_wallbox_freigabe
- id: public_ladekosten
  alias: Demo ladekosten
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.beispiel_wallbox_kwh
  - trigger: state
    entity_id: sensor.beispiel_tibber_eur_kwh
  - trigger: state
    entity_id: sensor.beispiel_ladestatus
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  actions:
  - condition: template
    value_template: '{{ is_number(states(''sensor.beispiel_wallbox_kwh'')) and is_number(states(''sensor.beispiel_tibber_eur_kwh''))
      and 0 <= states(''sensor.beispiel_tibber_eur_kwh'') | float(-1) <= 10 and 0 <= states(''sensor.beispiel_wallbox_kwh'')
      | float(-1) <= 1000000 and states(''sensor.beispiel_ladestatus'') not in [''unknown'',''unavailable''] }}'
  - choose:
    - conditions: '{{ is_state(''sensor.beispiel_ladestatus'',''charging'') and is_state(''input_boolean.demo_ladesitzung'',''off'')
        }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.demo_lade_zaehler
        data:
          value: '{{ states(''sensor.beispiel_wallbox_kwh'') | float(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.demo_lade_preis
        data:
          value: '{{ states(''sensor.beispiel_tibber_eur_kwh'') | float(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.demo_lade_kosten
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.demo_lade_energie
        data:
          value: 0
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.demo_ladesitzung
    - conditions: '{{ is_state(''input_boolean.demo_ladesitzung'',''on'') }}'
      sequence:
      - variables:
          delta: '{{ states(''sensor.beispiel_wallbox_kwh'') | float(0) - states(''input_number.demo_lade_zaehler'')
            | float(0) }}'
      - condition: template
        value_template: '{{ 0 <= delta | float(-1) <= 100 }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.demo_lade_kosten
        data:
          value: '{{ (states(''input_number.demo_lade_kosten'') | float(0) + delta | float(0) * states(''input_number.demo_lade_preis'')
            | float(0)) | round(4) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.demo_lade_energie
        data:
          value: '{{ (states(''input_number.demo_lade_energie'') | float(0) + delta | float(0)) | round(3) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.demo_lade_zaehler
        data:
          value: '{{ states(''sensor.beispiel_wallbox_kwh'') | float(0) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.demo_lade_preis
        data:
          value: '{{ states(''sensor.beispiel_tibber_eur_kwh'') | float(0) }}'
      - if:
        - condition: template
          value_template: '{{ not is_state(''sensor.beispiel_ladestatus'',''charging'') and as_timestamp(now())
            - as_timestamp(states.sensor.beispiel_ladestatus.last_changed, as_timestamp(now())) >= 300 }}'
        then:
        - action: input_number.set_value
          target:
            entity_id: input_number.demo_letzte_energie
          data:
            value: '{{ states(''input_number.demo_lade_energie'') | float(0) }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.demo_letzte_kosten
          data:
            value: '{{ states(''input_number.demo_lade_kosten'') | float(0) }}'
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.demo_ladesitzung
script:
  demo_abschliessen:
    alias: Demo abschliessen
    sequence:
    - condition: state
      entity_id: input_boolean.demo_sicherheit_freigabe
      state: 'on'
    - condition: template
      value_template: '{{ is_state(''person.beispiel_a'',''not_home'') and is_state(''person.beispiel_b'',''not_home'')
        }}'
    - condition: state
      entity_id: binary_sensor.beispiel_tuer_offen
      state: 'off'
    - action: lock.lock
      target:
        entity_id: lock.beispiel_eingang
    - wait_template: '{{ is_state(''lock.beispiel_eingang'',''locked'') }}'
      timeout: 00:02:00
      continue_on_timeout: true
    - condition: state
      entity_id: lock.beispiel_eingang
      state: locked
sensor:
- platform: integration
  source: sensor.demo_ecoflow_ladung
  name: Demo EcoFlow Ladung Energie
  unit_prefix: k
  unit_time: h
  method: left
- platform: integration
  source: sensor.demo_ecoflow_entladung
  name: Demo EcoFlow Entladung Energie
  unit_prefix: k
  unit_time: h
  method: left
shell_command:
  demo_camera_maintain: python3 /config/demo_camera_media.py maintain
rest_command:
  demo_camera_finished:
    url: !secret 'demo_camera_webhook_url'
    method: post
    headers:
      X-Gitlab-Token: !secret 'demo_camera_webhook_token'
    content_type: application/json
    payload: '{{ {''event_type'':''camera_phase_finished'',''camera'':camera,''episode_id'':episode_id,''started_at'':started_at,''ended_at'':ended_at,''reason'':reason,''snapshot_count'':snapshot_count
      | int} | to_json }}'
