# Generiert mit scripts/build.py; nur fiktive Entity-IDs.
input_boolean:
  demo_bt_freigabe:
    name: demo_bt_freigabe
    initial: false
  demo_wolf_freigabe:
    name: demo_wolf_freigabe
    initial: false
  demo_sicherheit_freigabe:
    name: demo_sicherheit_freigabe
    initial: false
  demo_laden_freigabe:
    name: demo_laden_freigabe
    initial: false
  demo_kalender_ownership:
    name: demo_kalender_ownership
  demo_wolf_ownership:
    name: demo_wolf_ownership
  demo_shadow:
    name: demo_shadow
  demo_nacht:
    name: demo_nacht
  demo_ladesitzung:
    name: demo_ladesitzung
  demo_lade_zaehler_gueltig:
    name: demo_lade_zaehler_gueltig
  demo_aufnahme_ownership_zone_01:
    name: demo_aufnahme_ownership_zone_01
  demo_aufnahme_ownership_zone_02:
    name: demo_aufnahme_ownership_zone_02
  demo_aufnahme_ownership_zone_03:
    name: demo_aufnahme_ownership_zone_03
  demo_aufnahme_ownership_zone_04:
    name: demo_aufnahme_ownership_zone_04
  demo_aufnahme_ownership_zone_05:
    name: demo_aufnahme_ownership_zone_05
  demo_aufnahme_ownership_zone_06:
    name: demo_aufnahme_ownership_zone_06
input_number:
  demo_lade_zaehler:
    name: demo_lade_zaehler
    min: 0
    max: 1000000
    step: 0.001
    mode: box
    unit_of_measurement: kWh
  demo_lade_kosten:
    name: demo_lade_kosten
    min: 0
    max: 100000
    step: 0.0001
    mode: box
    unit_of_measurement: EUR
  demo_lade_energie:
    name: demo_lade_energie
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: kWh
  demo_lade_preis:
    name: demo_lade_preis
    min: 0
    max: 10
    step: 1.0e-05
    mode: box
    unit_of_measurement: EUR/kWh
  demo_letzte_energie:
    name: demo_letzte_energie
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: kWh
  demo_letzte_kosten:
    name: demo_letzte_kosten
    min: 0
    max: 100000
    step: 0.0001
    mode: box
    unit_of_measurement: EUR
input_text:
  demo_kalender_wolf_vorher:
    name: demo_kalender_wolf_vorher
    max: 50
  demo_wolf_ziel:
    name: demo_wolf_ziel
    max: 50
template:
- sensor:
  - name: Demo Shadow Punkte
    state: '{% set ns = namespace(points=0,invalid=0,max_deficit=0,hold=false) %}{% for r in [{''e'':''climate.beispiel_bt_01'',''w'':2,''w600'':false},{''e'':''climate.beispiel_bt_02'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_03'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_04'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_05'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_06'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_07'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_08'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_09'',''w'':1,''w600'':false},{''e'':''climate.beispiel_w600_01'',''w'':1,''w600'':true},{''e'':''climate.beispiel_w600_02'',''w'':1,''w600'':true}]
      %}{% set idx = r.e[-2:] %}{% set v = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_gueltig'',''on'') if
      r.w600 else states(r.e) not in [''unknown'',''unavailable''] and state_attr(r.e,''degraded_mode'') != true
      and state_attr(r.e,''errors'') in [none, [], ''''] and is_number(state_attr(r.e,''temperature'')) and is_number(state_attr(r.e,''current_temperature'')))
      %}{% if not v %}{% set ns.invalid = ns.invalid + 1 %}{% else %}{% set heat = state_attr(r.e,''hvac_action'')
      == ''heating'' %}{% set deficit = state_attr(r.e,''temperature'') | float(0) - state_attr(r.e,''current_temperature'')
      | float(0) %}{% set start = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_start'',''on'') if r.w600 else
      heat and deficit >= 0.3) %}{% set holding = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_halten'',''on'')
      if r.w600 else heat) %}{% if start %}{% set ns.points = ns.points + r.w %}{% endif %}{% if holding %}{% set
      ns.hold = true %}{% endif %}{% if heat and deficit > ns.max_deficit %}{% set ns.max_deficit = deficit %}{%
      endif %}{% endif %}{% endfor %}{{ ns.points }}'
  - name: Demo Shadow Ungueltig
    state: '{% set ns = namespace(points=0,invalid=0,max_deficit=0,hold=false) %}{% for r in [{''e'':''climate.beispiel_bt_01'',''w'':2,''w600'':false},{''e'':''climate.beispiel_bt_02'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_03'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_04'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_05'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_06'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_07'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_08'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_09'',''w'':1,''w600'':false},{''e'':''climate.beispiel_w600_01'',''w'':1,''w600'':true},{''e'':''climate.beispiel_w600_02'',''w'':1,''w600'':true}]
      %}{% set idx = r.e[-2:] %}{% set v = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_gueltig'',''on'') if
      r.w600 else states(r.e) not in [''unknown'',''unavailable''] and state_attr(r.e,''degraded_mode'') != true
      and state_attr(r.e,''errors'') in [none, [], ''''] and is_number(state_attr(r.e,''temperature'')) and is_number(state_attr(r.e,''current_temperature'')))
      %}{% if not v %}{% set ns.invalid = ns.invalid + 1 %}{% else %}{% set heat = state_attr(r.e,''hvac_action'')
      == ''heating'' %}{% set deficit = state_attr(r.e,''temperature'') | float(0) - state_attr(r.e,''current_temperature'')
      | float(0) %}{% set start = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_start'',''on'') if r.w600 else
      heat and deficit >= 0.3) %}{% set holding = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_halten'',''on'')
      if r.w600 else heat) %}{% if start %}{% set ns.points = ns.points + r.w %}{% endif %}{% if holding %}{% set
      ns.hold = true %}{% endif %}{% if heat and deficit > ns.max_deficit %}{% set ns.max_deficit = deficit %}{%
      endif %}{% endif %}{% endfor %}{{ ns.invalid }}'
  - name: Demo Shadow Defizit
    state: '{% set ns = namespace(points=0,invalid=0,max_deficit=0,hold=false) %}{% for r in [{''e'':''climate.beispiel_bt_01'',''w'':2,''w600'':false},{''e'':''climate.beispiel_bt_02'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_03'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_04'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_05'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_06'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_07'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_08'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_09'',''w'':1,''w600'':false},{''e'':''climate.beispiel_w600_01'',''w'':1,''w600'':true},{''e'':''climate.beispiel_w600_02'',''w'':1,''w600'':true}]
      %}{% set idx = r.e[-2:] %}{% set v = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_gueltig'',''on'') if
      r.w600 else states(r.e) not in [''unknown'',''unavailable''] and state_attr(r.e,''degraded_mode'') != true
      and state_attr(r.e,''errors'') in [none, [], ''''] and is_number(state_attr(r.e,''temperature'')) and is_number(state_attr(r.e,''current_temperature'')))
      %}{% if not v %}{% set ns.invalid = ns.invalid + 1 %}{% else %}{% set heat = state_attr(r.e,''hvac_action'')
      == ''heating'' %}{% set deficit = state_attr(r.e,''temperature'') | float(0) - state_attr(r.e,''current_temperature'')
      | float(0) %}{% set start = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_start'',''on'') if r.w600 else
      heat and deficit >= 0.3) %}{% set holding = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_halten'',''on'')
      if r.w600 else heat) %}{% if start %}{% set ns.points = ns.points + r.w %}{% endif %}{% if holding %}{% set
      ns.hold = true %}{% endif %}{% if heat and deficit > ns.max_deficit %}{% set ns.max_deficit = deficit %}{%
      endif %}{% endif %}{% endfor %}{{ ns.max_deficit }}'
  - name: Demo EcoFlow Ladung
    state: '{{ [states(''sensor.beispiel_ecoflow_batterie_w'') | float(0),0] | max }}'
    availability: '{{ is_number(states(''sensor.beispiel_ecoflow_batterie_w'')) }}'
    unit_of_measurement: W
    device_class: power
    state_class: measurement
  - name: Demo EcoFlow Entladung
    state: '{{ [0 - states(''sensor.beispiel_ecoflow_batterie_w'') | float(0),0] | max }}'
    availability: '{{ is_number(states(''sensor.beispiel_ecoflow_batterie_w'')) }}'
    unit_of_measurement: W
    device_class: power
    state_class: measurement
  binary_sensor:
  - name: Demo W600 01 gueltig
    state: '{% set c = states(''climate.beispiel_w600_01'') %}{% set v = states(''sensor.beispiel_w600_01_ventil'')
      %}{% set x = states.sensor.beispiel_w600_01_ventil %}{{ c not in [''unknown'',''unavailable''] and is_number(state_attr(''climate.beispiel_w600_01'',''temperature''))
      and is_number(state_attr(''climate.beispiel_w600_01'',''current_temperature'')) and is_number(v) and 0 <=
      v | float(-1) <= 100 and x is not none and 0 <= as_timestamp(now()) - as_timestamp(x.last_reported, 0) <=
      21600 }}'
  - name: Demo W600 01 start
    state: '{{ is_state(''binary_sensor.demo_w600_01_gueltig'',''on'') and state_attr(''climate.beispiel_w600_01'',''hvac_action'')
      == ''heating'' and state_attr(''climate.beispiel_w600_01'',''temperature'') | float(0) - state_attr(''climate.beispiel_w600_01'',''current_temperature'')
      | float(0) >= 0.3 and states(''sensor.beispiel_w600_01_ventil'') | float(0) > 70 }}'
  - name: Demo W600 01 halten
    state: '{{ is_state(''binary_sensor.demo_w600_01_gueltig'',''on'') and state_attr(''climate.beispiel_w600_01'',''hvac_action'')
      == ''heating'' and states(''sensor.beispiel_w600_01_ventil'') | float(0) >= 30 }}'
  - name: Demo W600 02 gueltig
    state: '{% set c = states(''climate.beispiel_w600_02'') %}{% set v = states(''sensor.beispiel_w600_02_ventil'')
      %}{% set x = states.sensor.beispiel_w600_02_ventil %}{{ c not in [''unknown'',''unavailable''] and is_number(state_attr(''climate.beispiel_w600_02'',''temperature''))
      and is_number(state_attr(''climate.beispiel_w600_02'',''current_temperature'')) and is_number(v) and 0 <=
      v | float(-1) <= 100 and x is not none and 0 <= as_timestamp(now()) - as_timestamp(x.last_reported, 0) <=
      21600 }}'
  - name: Demo W600 02 start
    state: '{{ is_state(''binary_sensor.demo_w600_02_gueltig'',''on'') and state_attr(''climate.beispiel_w600_02'',''hvac_action'')
      == ''heating'' and state_attr(''climate.beispiel_w600_02'',''temperature'') | float(0) - state_attr(''climate.beispiel_w600_02'',''current_temperature'')
      | float(0) >= 0.3 and states(''sensor.beispiel_w600_02_ventil'') | float(0) > 70 }}'
  - name: Demo W600 02 halten
    state: '{{ is_state(''binary_sensor.demo_w600_02_gueltig'',''on'') and state_attr(''climate.beispiel_w600_02'',''hvac_action'')
      == ''heating'' and states(''sensor.beispiel_w600_02_ventil'') | float(0) >= 30 }}'
  - name: Demo Shadow Halten
    state: '{% set ns = namespace(points=0,invalid=0,max_deficit=0,hold=false) %}{% for r in [{''e'':''climate.beispiel_bt_01'',''w'':2,''w600'':false},{''e'':''climate.beispiel_bt_02'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_03'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_04'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_05'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_06'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_07'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_08'',''w'':1,''w600'':false},{''e'':''climate.beispiel_bt_09'',''w'':1,''w600'':false},{''e'':''climate.beispiel_w600_01'',''w'':1,''w600'':true},{''e'':''climate.beispiel_w600_02'',''w'':1,''w600'':true}]
      %}{% set idx = r.e[-2:] %}{% set v = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_gueltig'',''on'') if
      r.w600 else states(r.e) not in [''unknown'',''unavailable''] and state_attr(r.e,''degraded_mode'') != true
      and state_attr(r.e,''errors'') in [none, [], ''''] and is_number(state_attr(r.e,''temperature'')) and is_number(state_attr(r.e,''current_temperature'')))
      %}{% if not v %}{% set ns.invalid = ns.invalid + 1 %}{% else %}{% set heat = state_attr(r.e,''hvac_action'')
      == ''heating'' %}{% set deficit = state_attr(r.e,''temperature'') | float(0) - state_attr(r.e,''current_temperature'')
      | float(0) %}{% set start = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_start'',''on'') if r.w600 else
      heat and deficit >= 0.3) %}{% set holding = (is_state(''binary_sensor.demo_w600_'' ~ idx ~ ''_halten'',''on'')
      if r.w600 else heat) %}{% if start %}{% set ns.points = ns.points + r.w %}{% endif %}{% if holding %}{% set
      ns.hold = true %}{% endif %}{% if heat and deficit > ns.max_deficit %}{% set ns.max_deficit = deficit %}{%
      endif %}{% endif %}{% endfor %}{{ ns.hold }}'
  - name: Demo Shadow Start Stabil
    state: '{{ is_number(states(''sensor.demo_shadow_punkte'')) and is_number(states(''sensor.demo_shadow_ungueltig''))
      and states(''sensor.demo_shadow_punkte'') | int(0) >= 2 and states(''sensor.demo_shadow_ungueltig'') | int(99)
      < 2 }}'
    delay_on: 00:05:00
  - name: Demo Shadow Komfort Stabil
    state: '{{ is_number(states(''sensor.demo_shadow_defizit'')) and is_number(states(''sensor.demo_shadow_ungueltig''))
      and states(''sensor.demo_shadow_defizit'') | float(0) >= 2 and states(''sensor.demo_shadow_ungueltig'') |
      int(99) < 2 }}'
    delay_on: 00:03:00
  - name: Demo Preis Guenstig
    state: '{{ is_number(states(''sensor.beispiel_tibber_eur_kwh'')) and 0 <= states(''sensor.beispiel_tibber_eur_kwh'')
      | float(-1) <= 10 and ((states(''sensor.beispiel_tibber_eur_kwh'') | float(99)) < 0.20 or (is_number(state_attr(''sensor.beispiel_tibber_eur_kwh'',''intraday_price_ranking''))
      and 0 <= state_attr(''sensor.beispiel_tibber_eur_kwh'',''intraday_price_ranking'') | float(99) <= 0.25)) }}'
automation:
- id: public_wolf_shadow
  alias: Demo wolf shadow
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.demo_shadow_start_stabil
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.demo_shadow_komfort_stabil
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.demo_shadow_halten
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  actions:
  - choose:
    - conditions: '{{ is_state(''binary_sensor.demo_shadow_start_stabil'',''on'') or is_state(''binary_sensor.demo_shadow_komfort_stabil'',''on'')
        }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.demo_shadow
    - conditions: '{{ is_state(''binary_sensor.demo_shadow_halten'',''off'') and is_state(''binary_sensor.demo_shadow_start_stabil'',''off'')
        and is_state(''binary_sensor.demo_shadow_komfort_stabil'',''off'') }}'
      sequence:
      - delay: 00:05:00
      - condition: template
        value_template: '{{ is_state(''binary_sensor.demo_shadow_halten'',''off'') and is_state(''binary_sensor.demo_shadow_start_stabil'',''off'')
          and is_state(''binary_sensor.demo_shadow_komfort_stabil'',''off'') }}'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.demo_shadow
- id: public_kalender_abwesenheit
  alias: Demo kalender abwesenheit
  mode: single
  triggers:
  - trigger: time
    at: 08:00:00
  - trigger: time
    at: '15:00:00'
  - trigger: time_pattern
    minutes: /15
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: calendar
    entity_id: calendar.beispiel_abwesenheit
    event: start
  - trigger: calendar
    entity_id: calendar.beispiel_abwesenheit
    event: end
  - trigger: state
    entity_id: calendar.beispiel_abwesenheit
  actions:
  - condition: template
    value_template: '{{ states(''calendar.beispiel_abwesenheit'') not in [''unknown'',''unavailable''] }}'
  - action: calendar.get_events
    target:
      entity_id: calendar.beispiel_abwesenheit
    data:
      start_date_time: '{{ today_at(''00:00'') }}'
      end_date_time: '{{ today_at(''00:00'') + timedelta(days=1) }}'
    response_variable: answer
    continue_on_error: true
  - condition: template
    value_template: '{% set ns = namespace(ok=false) %}{% if answer is defined and answer is mapping and ''calendar.beispiel_abwesenheit''
      in answer and answer[''calendar.beispiel_abwesenheit''] is mapping %}{% set events = answer[''calendar.beispiel_abwesenheit''].get(''events'')
      %}{% if events is sequence and events is not string and events is not mapping %}{% set ns.ok = true %}{% for
      e in events %}{% if e is not mapping or e.get(''start'') is not string or e.get(''end'') is not string or
      e.get(''summary'','''') is not string or as_datetime(e.get(''start''), none) is none or as_datetime(e.get(''end''),
      none) is none or as_timestamp(e.get(''end''), 0) <= as_timestamp(e.get(''start''), 0) %}{% set ns.ok = false
      %}{% endif %}{% endfor %}{% endif %}{% endif %}{{ ns.ok }}'
  - variables:
      away: '{% set ns = namespace(away=false) %}{% set t = as_timestamp(now()) %}{% for e in answer[''calendar.beispiel_abwesenheit''][''events'']
        %}{% set a = e.get(''start'') %}{% set b = e.get(''end'') %}{% if ''[Heizung]'' in (e.get(''summary'','''')
        | string) and a and b %}{% set first = (as_datetime(a).date() if a | string | length == 10 else as_local(as_datetime(a)).date())
        %}{% set last = ((as_datetime(b) - timedelta(days=1)).date() if b | string | length == 10 else as_local(as_datetime(b)
        - timedelta(seconds=1)).date()) %}{% set lo = as_timestamp(first | string ~ '' 15:00:00'') %}{% set hi =
        as_timestamp(last | string ~ '' 08:00:00'') %}{% if lo < hi and lo <= t < hi %}{% set ns.away = true %}{%
        endif %}{% endif %}{% endfor %}{{ ns.away }}'
  - choose:
    - conditions: '{{ away | bool(false) }}'
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.demo_bt_freigabe
          state: 'on'
        then:
        - choose:
          - conditions: '{{ is_state(''input_boolean.demo_kalender_ownership'',''on'') or not (state_attr(''climate.beispiel_bt_01'',''preset_mode'')
              == ''eco'' and state_attr(''climate.beispiel_bt_02'',''preset_mode'') == ''eco'' and state_attr(''climate.beispiel_bt_03'',''preset_mode'')
              == ''eco'' and state_attr(''climate.beispiel_bt_04'',''preset_mode'') == ''eco'' and state_attr(''climate.beispiel_bt_05'',''preset_mode'')
              == ''eco'' and state_attr(''climate.beispiel_bt_06'',''preset_mode'') == ''eco'' and state_attr(''climate.beispiel_bt_07'',''preset_mode'')
              == ''eco'' and state_attr(''climate.beispiel_bt_08'',''preset_mode'') == ''eco'' and state_attr(''climate.beispiel_bt_09'',''preset_mode'')
              == ''eco'') }}'
            sequence:
            - condition: template
              value_template: '{{ states(''climate.beispiel_bt_01'') not in [''unknown'',''unavailable''] and states(''climate.beispiel_bt_02'')
                not in [''unknown'',''unavailable''] and states(''climate.beispiel_bt_03'') not in [''unknown'',''unavailable'']
                and states(''climate.beispiel_bt_04'') not in [''unknown'',''unavailable''] and states(''climate.beispiel_bt_05'')
                not in [''unknown'',''unavailable''] and states(''climate.beispiel_bt_06'') not in [''unknown'',''unavailable'']
                and states(''climate.beispiel_bt_07'') not in [''unknown'',''unavailable''] and states(''climate.beispiel_bt_08'')
                not in [''unknown'',''unavailable''] and states(''climate.beispiel_bt_09'') not in [''unknown'',''unavailable'']
                }}'
            - action: climate.set_preset_mode
              target:
                entity_id: &id001
                - climate.beispiel_bt_01
                - climate.beispiel_bt_02
                - climate.beispiel_bt_03
                - climate.beispiel_bt_04
                - climate.beispiel_bt_05
                - climate.beispiel_bt_06
                - climate.beispiel_bt_07
                - climate.beispiel_bt_08
                - climate.beispiel_bt_09
              data:
                preset_mode: eco
