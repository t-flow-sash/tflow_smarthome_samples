# Generiert mit scripts/build.py; nur fiktive Entity-IDs.
# Baustein: template.Demo EcoFlow Ladung
# Zweck: Splittet positive Batterieleistung in einen nichtnegativen W-Sensor.
# Nutzen: Liefert die Quelle für den Ladung-Integrationssensor.
# Einbau: Als einzelnes Listenelement an die template:-Liste anhängen; nicht als Mapping einrücken.
# Abhängigkeiten: sensor.beispiel_ecoflow_batterie_w mit signierter Leistung in W.
# Anpassen: Vorzeichenkonvention und Einheit der eigenen EcoFlow-Integration prüfen.
# Sicherheitsgrenze: Bei ungültiger Telemetrie nicht verfügbar; kein Akku-Steuerbefehl.
# Entweder dieser Einzelbaustein oder packages/haus.yaml; niemals beide parallel installieren.
- sensor:
  - name: Demo EcoFlow Ladung
    state: '{{ [states(''sensor.beispiel_ecoflow_batterie_w'') | float(0),0] | max }}'
    availability: '{{ is_number(states(''sensor.beispiel_ecoflow_batterie_w'')) }}'
    unit_of_measurement: W
    device_class: power
    state_class: measurement
