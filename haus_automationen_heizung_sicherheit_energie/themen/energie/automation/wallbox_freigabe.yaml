# Generiert mit scripts/build.py; nur fiktive Entity-IDs.
# Baustein: automation.wallbox_freigabe
# Zweck: Setzt ausschließlich die Ladeerlaubnis der Wallbox.
# Nutzen: Erlaubt Laden bei Anschluss, Präsenz und günstigem Tarif; laufendes Laden darf bei Preiswechsel fortgesetzt werden.
# Wann: Bei Freigabe-, Stecker-, Tarif-, Lade- und Personenstatus, alle fünf Minuten und beim HA-Start.
# Einbau: Als einzelnes Listenelement an automation: (automations.yaml) anhängen; nicht als Mapping einrücken.
# Abhängigkeiten: input_boolean.demo_laden_freigabe, binary_sensor.demo_preis_guenstig, externer Stecker-/Ladestatus, Personen und switch.beispiel_wallbox_freigabe.
# Anpassen: Wallbox-Switch, Personen, Anschluss und Tarifadapter ersetzen.
# Sicherheitsgrenze: Freigabe-/Präsenz-Widerruf schaltet aus; Preis-Hysterese ist keine Erlaubnis ohne Zustimmung; keine Netztrennung.
# Entweder dieser Einzelbaustein oder packages/haus.yaml; niemals beide parallel installieren.
- id: public_wallbox_freigabe
  alias: Demo wallbox freigabe
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_boolean.demo_laden_freigabe
  - trigger: state
    entity_id: binary_sensor.beispiel_angeschlossen
  - trigger: state
    entity_id: binary_sensor.demo_preis_guenstig
  - trigger: state
    entity_id: sensor.beispiel_ladestatus
  - trigger: state
    entity_id: person.beispiel_a
  - trigger: state
    entity_id: person.beispiel_b
  - trigger: time_pattern
    minutes: /5
  - trigger: homeassistant
    event: start
  actions:
  - choose:
    - conditions: '{{ is_state(''input_boolean.demo_laden_freigabe'',''on'') and is_state(''binary_sensor.beispiel_angeschlossen'',''on'')
        and (is_state(''person.beispiel_a'',''home'') or is_state(''person.beispiel_b'',''home'')) and (is_state(''binary_sensor.demo_preis_guenstig'',''on'')
        or is_state(''sensor.beispiel_ladestatus'',''charging'')) }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.beispiel_wallbox_freigabe
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.beispiel_wallbox_freigabe
