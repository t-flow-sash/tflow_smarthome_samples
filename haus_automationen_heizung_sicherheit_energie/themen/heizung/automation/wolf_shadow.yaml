# Generiert mit scripts/build.py; nur fiktive Entity-IDs.
# Baustein: automation.wolf_shadow
# Zweck: Berechnet Heizbedarf aus gewichteten Raumwerten und setzt den reinen Shadow-Merker.
# Nutzen: Macht den Wärmebedarf sichtbar, ohne einen Wolf-Aktor zu schalten.
# Wann: Bei stabiler Start-/Komfortanforderung, Haltesignal, HA-Start oder Automation-Reload; Rücknahme erst nach fünf Minuten ohne Bedarf.
# Einbau: Als einzelnes Listenelement an automation: (automations.yaml) anhängen; nicht als Mapping einrücken.
# Abhängigkeiten: Shadow-Templates, input_boolean.demo_shadow; externe Better-Thermostat- und W600-Raumwerte.
# Anpassen: Raumgewichte, Gültigkeitsgrenzen und Schwellwerte an die Anlage anpassen.
# Sicherheitsgrenze: Kein direkter Kesselbefehl; Shadow ist nur ein Bedarfssignal.
# Entweder dieser Einzelbaustein oder packages/haus.yaml; niemals beide parallel installieren.
- id: public_wolf_shadow
  alias: Demo wolf shadow
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.demo_shadow_start_stabil
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.demo_shadow_komfort_stabil
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.demo_shadow_halten
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  actions:
  - choose:
    - conditions: '{{ is_state(''binary_sensor.demo_shadow_start_stabil'',''on'') or is_state(''binary_sensor.demo_shadow_komfort_stabil'',''on'')
        }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.demo_shadow
    - conditions: '{{ is_state(''binary_sensor.demo_shadow_halten'',''off'') and is_state(''binary_sensor.demo_shadow_start_stabil'',''off'')
        and is_state(''binary_sensor.demo_shadow_komfort_stabil'',''off'') }}'
      sequence:
      - delay: 00:05:00
      - condition: template
        value_template: '{{ is_state(''binary_sensor.demo_shadow_halten'',''off'') and is_state(''binary_sensor.demo_shadow_start_stabil'',''off'')
          and is_state(''binary_sensor.demo_shadow_komfort_stabil'',''off'') }}'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.demo_shadow
