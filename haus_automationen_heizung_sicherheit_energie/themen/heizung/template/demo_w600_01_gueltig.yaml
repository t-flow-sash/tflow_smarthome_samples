# Generiert mit scripts/build.py; nur fiktive Entity-IDs.
# Baustein: template.Demo W600 01 gueltig
# Zweck: Prüft Temperatur, Ventilstellung und frische W600-Telemetrie. (W600 01)
# Nutzen: Schließt unbekannte, veraltete oder unplausible Raumwerte aus.
# Einbau: Als einzelnes Listenelement an die template:-Liste anhängen; nicht als Mapping einrücken.
# Abhängigkeiten: climate.beispiel_w600_01, sensor.beispiel_w600_01_ventil
# Anpassen: W600 01: Raum- und Ventil-Entity sowie Grenzwerte prüfen.
# Sicherheitsgrenze: Messdaten älter als sechs Stunden gelten als ungültig.
# Entweder dieser Einzelbaustein oder packages/haus.yaml; niemals beide parallel installieren.
- binary_sensor:
  - name: Demo W600 01 gueltig
    state: '{% set c = states(''climate.beispiel_w600_01'') %}{% set v = states(''sensor.beispiel_w600_01_ventil'')
      %}{% set x = states.sensor.beispiel_w600_01_ventil %}{{ c not in [''unknown'',''unavailable''] and is_number(state_attr(''climate.beispiel_w600_01'',''temperature''))
      and is_number(state_attr(''climate.beispiel_w600_01'',''current_temperature'')) and is_number(v) and 0 <=
      v | float(-1) <= 100 and x is not none and 0 <= as_timestamp(now()) - as_timestamp(x.last_reported, 0) <=
      21600 }}'
