# Generiert mit scripts/build.py; nur fiktive Entity-IDs.
- binary_sensor:
  - name: Demo W600 02 start
    state: '{{ is_state(''binary_sensor.demo_w600_02_gueltig'',''on'') and state_attr(''climate.beispiel_w600_02'',''hvac_action'')
      == ''heating'' and state_attr(''climate.beispiel_w600_02'',''temperature'') | float(0) - state_attr(''climate.beispiel_w600_02'',''current_temperature'')
      | float(0) >= 0.3 and states(''sensor.beispiel_w600_02_ventil'') | float(0) > 70 }}'
