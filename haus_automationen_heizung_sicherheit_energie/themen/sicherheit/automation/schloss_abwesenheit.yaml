# Generiert mit scripts/build.py; nur fiktive Entity-IDs.
# Baustein: automation.schloss_abwesenheit
# Zweck: Ruft das Abschließ-Skript nur bei gesicherter Abwesenheit auf.
# Nutzen: Vermeidet einen Schlossbefehl bei unklarer Anwesenheit.
# Wann: Bei Zustandswechsel einer der beiden Personen.
# Einbau: Als einzelnes Listenelement an automation: (automations.yaml) anhängen; nicht als Mapping einrücken.
# Abhängigkeiten: person.beispiel_a/b, input_boolean.demo_sicherheit_freigabe und script.demo_abschliessen.
# Anpassen: Personen und Schloss-Skript der Testanlage zuordnen.
# Sicherheitsgrenze: Nur abschließen, niemals automatisch aufschließen; vor echtem Schlossbetrieb Türkontakt/Readback prüfen.
# Entweder dieser Einzelbaustein oder packages/haus.yaml; niemals beide parallel installieren.
- id: public_schloss_abwesenheit
  alias: Demo schloss abwesenheit
  mode: single
  triggers:
  - trigger: state
    entity_id: person.beispiel_a
  - trigger: state
    entity_id: person.beispiel_b
  actions:
  - condition: state
    entity_id: input_boolean.demo_sicherheit_freigabe
    state: 'on'
  - condition: template
    value_template: '{{ is_state(''person.beispiel_a'',''not_home'') and is_state(''person.beispiel_b'',''not_home'')
      }}'
  - action: script.demo_abschliessen
