# Generiert mit scripts/build.py; nur fiktive Entity-IDs.
# Baustein: automation.aufnahme_bei_abwesenheit
# Zweck: Gleicht sechs Aufnahme-Schalter mit Nacht- oder bestätigter Abwesenheit ab.
# Nutzen: Lässt nur selbst beanspruchte Aufnahme-Schalter beim Widerruf wieder los.
# Wann: Bei Personen-/Nacht-/Freigabewechsel, HA-Start und Reload.
# Einbau: Als einzelnes Listenelement an automation: (automations.yaml) anhängen; nicht als Mapping einrücken.
# Abhängigkeiten: person.beispiel_a/b, input_boolean.demo_nacht, demo_sicherheit_freigabe, sechs switch.beispiel_zone_XX_aufnahme und zugehörige Ownership-Helper.
# Anpassen: Zonen, Person-IDs und Aufnahme-Entity-IDs den eigenen Integrationen zuordnen.
# Sicherheitsgrenze: Unbekannte Präsenz gilt nicht als Abwesenheit; Ownership-Markierung und physischer Switch-Befehl sind nicht atomar.
# Entweder dieser Einzelbaustein oder packages/haus.yaml; niemals beide parallel installieren.
- id: public_aufnahme_bei_abwesenheit
  alias: Demo aufnahme bei abwesenheit
  mode: restart
  triggers:
  - trigger: state
    entity_id: person.beispiel_a
  - trigger: state
    entity_id: person.beispiel_b
  - trigger: state
    entity_id: input_boolean.demo_nacht
  - trigger: state
    entity_id: input_boolean.demo_sicherheit_freigabe
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  actions:
  - choose:
    - conditions: '{{ is_state(''input_boolean.demo_sicherheit_freigabe'',''on'') and (is_state(''person.beispiel_a'',''not_home'')
        and is_state(''person.beispiel_b'',''not_home'') or is_state(''input_boolean.demo_nacht'',''on'')) and is_state(''switch.beispiel_zone_01_aufnahme'',''off'')
        and is_state(''input_boolean.demo_aufnahme_ownership_zone_01'',''off'') }}'
      sequence:
      - condition: template
        value_template: '{{ is_state(''input_boolean.demo_sicherheit_freigabe'',''on'') and (is_state(''person.beispiel_a'',''not_home'')
          and is_state(''person.beispiel_b'',''not_home'') or is_state(''input_boolean.demo_nacht'',''on'')) and
          is_state(''switch.beispiel_zone_01_aufnahme'',''off'') and is_state(''input_boolean.demo_aufnahme_ownership_zone_01'',''off'')
          }}'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.demo_aufnahme_ownership_zone_01
      - action: switch.turn_on
        target:
          entity_id: switch.beispiel_zone_01_aufnahme
    - conditions: '{{ is_state(''input_boolean.demo_aufnahme_ownership_zone_01'',''on'') and not (is_state(''input_boolean.demo_sicherheit_freigabe'',''on'')
        and (is_state(''person.beispiel_a'',''not_home'') and is_state(''person.beispiel_b'',''not_home'') or is_state(''input_boolean.demo_nacht'',''on'')))
        }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''switch.beispiel_zone_01_aufnahme'',''on'') }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.beispiel_zone_01_aufnahme
        - wait_template: '{{ is_state(''switch.beispiel_zone_01_aufnahme'',''off'') }}'
          timeout: 00:00:05
          continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ is_state(''switch.beispiel_zone_01_aufnahme'',''off'') }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.demo_aufnahme_ownership_zone_01
