# Generiert mit scripts/build.py; nur fiktive Entity-IDs.
# Baustein: automation.kamera_zone_04
# Zweck: Erstellt begrenzte Snapshots bei Personen-/Tiererkennung in zone_04.
# Nutzen: Sammelt pro Episode Bilder aus zone_04 und meldet deren Ende an den Beispiel-Empfänger.
# Wann: Bei Erkennungsbeginn, demo_camera_continue, HA-Start und Reload; Akku-Kamera wartet zunächst auf Readiness.
# Einbau: Als einzelnes Listenelement an automation: (automations.yaml) anhängen; nicht als Mapping einrücken.
# Abhängigkeiten: camera.beispiel_zone_04, binary_sensor.beispiel_zone_04_person/tier, switch.beispiel_zone_04_aufnahme, input_boolean.demo_sicherheit_freigabe, rest_command.demo_camera_finished und /media/demo_camera/zone_04.
# Anpassen: Kamera-, Erkennungs- und Aufnahme-IDs von zone_04 sowie Medienpfad/Empfänger anpassen.
# Sicherheitsgrenze: Freigabe und Aufnahme vor jedem Bild prüfen; maximal 100 Frames pro Durchlauf, Best-Effort-Fortsetzung/POST ohne dauerhafte Outbox; /media-Sichtbarkeit beachten.
# Entweder dieser Einzelbaustein oder packages/haus.yaml; niemals beide parallel installieren.
- id: public_kamera_zone_04
  alias: Demo kamera zone 04
  mode: restart
  triggers:
  - trigger: template
    value_template: '{{ (is_state(''binary_sensor.beispiel_zone_04_person'',''on'') or is_state(''binary_sensor.beispiel_zone_04_tier'',''on''))
      }}'
  - trigger: event
    event_type: demo_camera_continue
    event_data:
      camera: zone_04
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  actions:
  - condition: state
    entity_id: input_boolean.demo_sicherheit_freigabe
    state: 'on'
  - variables:
      episode_id: '{{ trigger.event.data.episode_id if trigger.platform == ''event'' and trigger.event.event_type
        == ''demo_camera_continue'' else context.id | md5 }}'
      started_at: '{{ trigger.event.data.started_at if trigger.platform == ''event'' and trigger.event.event_type
        == ''demo_camera_continue'' else now().isoformat() }}'
      base_index: '{{ trigger.event.data.next_index | int(0) if trigger.platform == ''event'' and trigger.event.event_type
        == ''demo_camera_continue'' else 0 }}'
  - wait_template: '{{ states(''camera.beispiel_zone_04'') not in [''unknown'',''unavailable''] or not is_state(''input_boolean.demo_sicherheit_freigabe'',''on'')
      or not is_state(''switch.beispiel_zone_04_aufnahme'',''on'') or not (is_state(''binary_sensor.beispiel_zone_04_person'',''on'')
      or is_state(''binary_sensor.beispiel_zone_04_tier'',''on'')) }}'
    timeout: 00:00:30
    continue_on_timeout: true
  - repeat:
      count: 100
      sequence:
      - choose:
        - conditions: '{{ is_state(''input_boolean.demo_sicherheit_freigabe'',''on'') and is_state(''switch.beispiel_zone_04_aufnahme'',''on'')
            and (is_state(''binary_sensor.beispiel_zone_04_person'',''on'') or is_state(''binary_sensor.beispiel_zone_04_tier'',''on''))
            and states(''camera.beispiel_zone_04'') not in [''unknown'',''unavailable''] }}'
          sequence:
          - action: camera.snapshot
            target:
              entity_id: camera.beispiel_zone_04
            data:
              filename: /media/demo_camera/zone_04/{{ now().strftime("%Y%m%dT%H%M%S%f") }}_{{ episode_id }}_{{ base_index
                | int + repeat.index }}.jpg
            continue_on_error: true
          - delay: 00:00:05
        default:
        - variables:
            reason: '{{ ''recording_disabled'' if not is_state(''input_boolean.demo_sicherheit_freigabe'',''on'')
              or not is_state(''switch.beispiel_zone_04_aufnahme'',''on'') else ''detection_ended'' if not (is_state(''binary_sensor.beispiel_zone_04_person'',''on'')
              or is_state(''binary_sensor.beispiel_zone_04_tier'',''on'')) else ''camera_unavailable'' }}'
            ended_at: '{{ now().isoformat() }}'
            snapshot_count: '{{ base_index | int + repeat.index - 1 }}'
        - action: rest_command.demo_camera_finished
          data:
            camera: zone_04
            episode_id: '{{ episode_id }}'
            started_at: '{{ started_at }}'
            ended_at: '{{ ended_at }}'
            reason: '{{ reason }}'
            snapshot_count: '{{ snapshot_count | int }}'
        - stop: Episode abgeschlossen
  - choose:
    - conditions: '{{ is_state(''input_boolean.demo_sicherheit_freigabe'',''on'') and is_state(''switch.beispiel_zone_04_aufnahme'',''on'')
        and (is_state(''binary_sensor.beispiel_zone_04_person'',''on'') or is_state(''binary_sensor.beispiel_zone_04_tier'',''on''))
        and states(''camera.beispiel_zone_04'') not in [''unknown'',''unavailable''] }}'
      sequence:
      - event: demo_camera_continue
        event_data:
          camera: zone_04
          episode_id: '{{ episode_id }}'
          started_at: '{{ started_at }}'
          next_index: '{{ base_index | int + 100 }}'
    default:
    - variables:
        reason: '{{ ''recording_disabled'' if not is_state(''input_boolean.demo_sicherheit_freigabe'',''on'') or
          not is_state(''switch.beispiel_zone_04_aufnahme'',''on'') else ''detection_ended'' if not (is_state(''binary_sensor.beispiel_zone_04_person'',''on'')
          or is_state(''binary_sensor.beispiel_zone_04_tier'',''on'')) else ''camera_unavailable'' }}'
        ended_at: '{{ now().isoformat() }}'
        snapshot_count: '{{ base_index | int + 100 }}'
    - action: rest_command.demo_camera_finished
      data:
        camera: zone_04
        episode_id: '{{ episode_id }}'
        started_at: '{{ started_at }}'
        ended_at: '{{ ended_at }}'
        reason: '{{ reason }}'
        snapshot_count: '{{ snapshot_count | int }}'
