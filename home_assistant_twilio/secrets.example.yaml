# =============================================================================
# Zweck: Vollständige Schlüsselliste für die private Home-Assistant-secrets.yaml.
# Nutzen: Verhindert vergessene Abhängigkeiten, ohne echte Werte zu veröffentlichen.
# Einbau: Nur die Schlüssel in /config/secrets.yaml übernehmen und dort die
#         REPLACE_WITH_...-Texte durch eigene Werte ersetzen; diese Datei bleibt
#         als öffentliches Beispiel unverändert.
# Abhängigkeiten: Eigenes Twilio-Konto, SMS- und sprachfähige Twilio-Nummern
#                 sowie ein Kontakt im internationalen E.164-Format.
# Anpassen: Jede Telefonnummer mit führendem Plus in Anführungszeichen setzen.
# Sicherheitsgrenze: Niemals echte SID, Tokens, Nummern oder Webhook-URLs in
#                    diese öffentliche Beispieldatei oder Git-Historie schreiben.
# =============================================================================

twilio_account_sid: "REPLACE_WITH_TWILIO_ACCOUNT_SID"
twilio_auth_token: "REPLACE_WITH_TWILIO_AUTH_TOKEN"
twilio_sms_from_number: "REPLACE_WITH_TWILIO_SMS_E164_SENDER_NUMBER"
twilio_call_from_number: "REPLACE_WITH_TWILIO_VOICE_E164_SENDER_NUMBER"
twilio_contact_number: "REPLACE_WITH_ALLOWED_E164_CONTACT_NUMBER"
