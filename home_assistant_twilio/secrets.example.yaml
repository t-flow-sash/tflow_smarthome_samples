# =============================================================================
# Zweck: Ausschließlich die privaten Twilio-Zugangsdaten benennen.
# Nutzen: Die öffentliche Konfiguration bleibt kopierbar, ohne SID oder Token
#         zu veröffentlichen oder einen SMS-Empfänger als Secret vorzutäuschen.
# Einbau: Diese zwei Schlüssel in /config/secrets.yaml übernehmen und dort die
#         REPLACE_WITH_...-Werte privat ersetzen; diese Beispieldatei bleibt so.
# Abhängigkeiten: Eigenes Twilio-Konto mit für SMS freigeschaltetem Absender.
# Anpassen: Account SID und Auth Token aus der eigenen Twilio Console eintragen.
# Sicherheitsgrenze: Niemals echte SID, Tokens, Nummern, Webhook-IDs oder private
#                    Hosts in dieses öffentliche Beispiel oder Git schreiben.
# =============================================================================

twilio_account_sid: "REPLACE_WITH_TWILIO_ACCOUNT_SID"
twilio_auth_token: "REPLACE_WITH_TWILIO_AUTH_TOKEN"
