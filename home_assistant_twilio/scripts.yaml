# =============================================================================
# Zweck: Getrennte, begrenzte Versandwege für Twilio-SMS und Twilio-Anrufe.
# Nutzen: Hält einen festen Kontakt, Längenprüfungen und die jeweils passende
#         Notify-Action zentral, ohne SMS- und Call-Semantik zu vermischen.
# Einbau: Als Mapping via script: !include scripts.yaml laden oder beide Schlüssel
#         unter den vorhandenen script:-Block übernehmen.
# Abhängigkeiten: notify.twilio_sms, notify.twilio_call aus configuration.yaml
#                 und das private Secret twilio_contact_number.
# Anpassen: Maximallängen/Kurztexte bewusst wählen; Notifier-Namen bei einer
#           Umbenennung in configuration.yaml und hier konsistent ändern.
# Sicherheitsgrenze: SMS und Anrufe können Kosten verursachen. Beide Scripts
#                    senden nur an denselben fest allowlisteten Kontakt.
# =============================================================================

# -----------------------------------------------------------------------------
# Zweck: Begrenzte Textnachricht an den festen Kontakt senden.
# Nutzen: Zentralisiert Ziel, Textnormalisierung und SMS-Längenlimit.
# Einbau: Unter script: einfügen und mit script.twilio_sms_sicher_senden aufrufen.
# Abhängigkeiten: notify.twilio_sms und !secret twilio_contact_number.
# Anpassen: Grenze nur unter Beachtung von GSM-7, Unicode und Multipart ändern.
# Sicherheitsgrenze: 320 Zeichen sind keine Ein-Segment- oder Kostengarantie.
# -----------------------------------------------------------------------------
twilio_sms_sicher_senden:
  alias: "Twilio: begrenzte SMS senden"
  description: >-
    Sendet 1 bis 320 Zeichen ausschließlich an den fest freigegebenen Kontakt.
    Die SMS-Absendernummer stammt aus der Notify-Konfiguration.
  mode: queued
  max: 3
  fields:
    message:
      name: Nachricht
      description: "Zu sendender SMS-Text (1 bis 320 Zeichen)."
      required: true
      selector:
        text:
          multiline: true
  sequence:
    - variables:
        sms_text: "{{ message | string | trim }}"
    - condition: template
      value_template: "{{ 0 < sms_text | length <= 320 }}"
    - action: notify.twilio_sms
      data:
        message: "{{ sms_text }}"
        target:
          - !secret twilio_contact_number

# -----------------------------------------------------------------------------
# Zweck: Kurzen TTS-Sprachanruf an den festen Kontakt auslösen.
# Nutzen: Zeigt twilio_call separat und verhindert dynamische Ziele sowie URLs.
# Einbau: Unter script: einfügen und mit script.twilio_anruf_sicher_starten aufrufen.
# Abhängigkeiten: notify.twilio_call, sprachfähige Twilio-Nummer und Kontakt-Secret.
# Anpassen: Ansagetext und 240-Zeichen-Grenze bewusst knapp halten.
# Sicherheitsgrenze: Jeder Aufruf kann Telefonkosten verursachen. HTTP(S)-Texte
#                    werden abgelehnt, damit das Beispiel keine TwiML-URL lädt.
# -----------------------------------------------------------------------------
twilio_anruf_sicher_starten:
  alias: "Twilio: begrenzten Sprachanruf starten"
  description: >-
    Liest 1 bis 240 Zeichen per Twilio-TTS ausschließlich dem fest freigegebenen
    Kontakt vor. URL-basierte TwiML-/Twimlet-Nachrichten sind ausgeschlossen.
  mode: single
  fields:
    message:
      name: Ansage
      description: "Vorzulesender Text (1 bis 240 Zeichen, keine URL)."
      required: true
      selector:
        text:
          multiline: true
  sequence:
    - variables:
        call_text: "{{ message | string | trim }}"
    - condition: template
      value_template: "{{ 0 < call_text | length <= 240 }}"
    - condition: template
      value_template: >-
        {{ not (call_text | lower).startswith('http://')
           and not (call_text | lower).startswith('https://') }}
    - action: notify.twilio_call
      data:
        message: "{{ call_text }}"
        target:
          - !secret twilio_contact_number
