# ============================================================================
# Küche oben Nacht-/Kinderlogik
# ----------------------------------------------------------------------------
# WANN: Statusänderung von binary_sensor.kuche_presence_presence auf on; Statusänderung von binary_sensor.kuche_presence_presence auf off; illuminance.crossed_threshold bei sensor.kuche_presence_illuminance; Statusänderung von input_boolean.nachtmodus, input_boolean.gute_nacht_kind_1, input_boolean.gute_nacht_kind_2; Home Assistant: start
# WAS:  Die Automation führt `input_boolean.turn_off`, `light.turn_off`, `light.turn_on` aus (mit verzweigten Bedingungen).
# ANPASSEN: Alle Entity-, Area-, Device- und Browser-IDs an dein Setup anpassen.
# ABHÄNGIGKEITEN (Auszug): `binary_sensor.kuche_presence_presence`, `sensor.kuche_presence_illuminance`, `input_boolean.nachtmodus`, `input_boolean.gute_nacht_kind_1`, `input_boolean.gute_nacht_kind_2`, `input_boolean.turn_off`, `input_boolean.kuche_oben_override_aktiv`, `light.turn_off`, `light.kuche_kuche_arbeitsplatte_links`, `light.kuche_kuche_arbeitsplatte_rechts` (+4 weitere)
# HINWEIS: Geräte-/Browser-IDs und private URLs wurden für GitHub neutralisiert.
# ============================================================================
- id: kuche_oben_nacht_und_gute_nacht
  alias: Küche oben Nacht-/Kinderlogik
  description: Schaltet die drei oberen Küchenleuchten bei Präsenz und Dunkelheit
    nach Nachtmodus/Kinderregel ein; bei fehlender Präsenz gehen Arbeitsplatte und
    obere Küchenlichter aus.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.kuche_presence_presence
    to:
    - 'on'
    id: presence_on
  - trigger: state
    entity_id:
    - binary_sensor.kuche_presence_presence
    to:
    - 'off'
    id: presence_off
  - trigger: illuminance.crossed_threshold
    target:
      entity_id:
      - sensor.kuche_presence_illuminance
    options:
      threshold:
        type: below
        value:
          active_choice: number
          number: 40
      for:
        hours: 0
        minutes: 0
        seconds: 0
      behavior: each
    id: dark
  - trigger: state
    entity_id:
    - input_boolean.nachtmodus
    - input_boolean.gute_nacht_kind_1
    - input_boolean.gute_nacht_kind_2
    id: mode_change
  - trigger: homeassistant
    event: start
    id: startup
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - presence_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kuche_oben_override_aktiv
      - action: light.turn_off
        target:
          entity_id:
          - light.kuche_kuche_arbeitsplatte_links
          - light.kuche_kuche_arbeitsplatte_rechts
          - light.kuche_links_oben
          - light.kuche_backofen_oben
          - light.kuche_rechts_oben
        data:
          transition: 1
    - conditions:
      - condition: trigger
        id:
        - presence_on
        - dark
        - mode_change
        - startup
      - condition: state
        entity_id: binary_sensor.kuche_presence_presence
        state: 'on'
      - condition: illuminance.is_value
        target:
          entity_id:
          - sensor.kuche_presence_illuminance
        options:
          behavior: any
          for: 00:00:00
          threshold:
            type: below
            value:
              active_choice: number
              number: 40
      - condition: state
        entity_id: input_boolean.kuche_oben_override_aktiv
        state: 'off'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.nachtmodus
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.kuche_links_oben
              - light.kuche_backofen_oben
              - light.kuche_rechts_oben
            data:
              brightness_pct: 15
              color_temp_kelvin: 2000
              transition: 1
        - conditions:
          - condition: state
            entity_id: input_boolean.gute_nacht_kind_1
            state: 'on'
          - condition: state
            entity_id: input_boolean.gute_nacht_kind_2
            state: 'on'
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.kuche_links_oben
              - light.kuche_backofen_oben
              - light.kuche_rechts_oben
            data:
              brightness_pct: 50
              color_temp_kelvin: 2000
              transition: 1
        default:
        - action: light.turn_on
          target:
            entity_id:
            - light.kuche_links_oben
            - light.kuche_backofen_oben
            - light.kuche_rechts_oben
          data:
            brightness_pct: 70
            color_temp_kelvin: 2700
            transition: 1
  mode: restart
