# ============================================================================
# Kind 2 Deckenlicht Präsenz
# ----------------------------------------------------------------------------
# WANN: Statusänderung von binary_sensor.praesenz_kind_2_presence auf on; Zahlenwert von sensor.praesenz_kind_2_illuminance unter 40; Statusänderung von binary_sensor.praesenz_kind_2_presence auf off; Statusänderung von input_boolean.gute_nacht_kind_2 auf off; Home Assistant: start
# WAS:  Die Automation führt `input_boolean.turn_off`, `light.turn_off`, `light.turn_on` aus (mit verzweigten Bedingungen).
# ANPASSEN: Alle Entity-, Area-, Device- und Browser-IDs an dein Setup anpassen.
# ABHÄNGIGKEITEN (Auszug): `binary_sensor.praesenz_kind_2_presence`, `sensor.praesenz_kind_2_illuminance`, `input_boolean.gute_nacht_kind_2`, `input_boolean.turn_off`, `input_boolean.kind_2_deckenlicht_override_aktiv`, `light.turn_off`, `light.deckenlicht_lia_white`, `light.deckenlicht_lia_rgb`, `light.turn_on`
# HINWEIS: Geräte-/Browser-IDs und private URLs wurden für GitHub neutralisiert.
# ============================================================================
- id: kind_2_deckenlicht_praesenz
  alias: Kind 2 Deckenlicht Präsenz
  description: Unter 40 lx bei Präsenz 50% Warmweiß plus 100% Pink; bei Abwesenheit aus. Gute-Nacht-Modus und aktiver Wandtaster-Override sperren die Automatik.
  triggers:
  - trigger: state
    entity_id: binary_sensor.praesenz_kind_2_presence
    to: 'on'
    id: presence_on
  - trigger: numeric_state
    entity_id: sensor.praesenz_kind_2_illuminance
    below: 40
    id: dark
  - trigger: state
    entity_id: binary_sensor.praesenz_kind_2_presence
    to: 'off'
    id: presence_off
  - trigger: state
    entity_id: input_boolean.gute_nacht_kind_2
    to: 'off'
    id: goodnight_off
  - trigger: homeassistant
    event: start
    id: startup
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: presence_off
      - condition: state
        entity_id: input_boolean.gute_nacht_kind_2
        state: 'off'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.kind_2_deckenlicht_override_aktiv
      - action: light.turn_off
        target:
          entity_id:
          - light.deckenlicht_lia_white
          - light.deckenlicht_lia_rgb
        data:
          transition: 1
    - conditions:
      - condition: trigger
        id:
        - presence_on
        - dark
        - goodnight_off
        - startup
      - condition: state
        entity_id: binary_sensor.praesenz_kind_2_presence
        state: 'on'
      - condition: numeric_state
        entity_id: sensor.praesenz_kind_2_illuminance
        below: 40
      - condition: state
        entity_id: input_boolean.gute_nacht_kind_2
        state: 'off'
      - condition: state
        entity_id: input_boolean.kind_2_deckenlicht_override_aktiv
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.deckenlicht_lia_white
        data:
          brightness_pct: 50
          color_temp_kelvin: 2702
          transition: 1
      - action: light.turn_on
        target:
          entity_id: light.deckenlicht_lia_rgb
        data:
          brightness_pct: 100
          rgb_color:
          - 255
          - 20
          - 147
          transition: 1
  mode: restart
