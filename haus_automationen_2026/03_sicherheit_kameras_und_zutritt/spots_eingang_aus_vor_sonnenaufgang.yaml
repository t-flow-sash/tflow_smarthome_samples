# ============================================================================
# Spots Eingang Aus vor Sonnenaufgang
# ----------------------------------------------------------------------------
# WANN: Sonne: sunrise mit Offset -00:30:00
# WAS:  Die Automation führt `light.turn_off` aus.
# ANPASSEN: Alle Entity-, Area-, Device- und Browser-IDs an dein Setup anpassen.
# ABHÄNGIGKEITEN (Auszug): `light.turn_off`, `light.garten_spots_eingang`
# HINWEIS: Geräte-/Browser-IDs und private URLs wurden für GitHub neutralisiert.
# ============================================================================
- id: spots_eingang_aus_vor_sonnenaufgang
  alias: Spots Eingang Aus vor Sonnenaufgang
  description: Schaltet die Spots 30 Minuten vor Sonnenaufgang aus
  triggers:
  - trigger: sun
    event: sunrise
    offset: -00:30:00
  conditions: []
  actions:
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.garten_spots_eingang
    data: {}
  mode: single
