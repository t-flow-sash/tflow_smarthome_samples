# ============================================================================
# Spots Eingang Automatik
# ----------------------------------------------------------------------------
# WANN: Sonne: sunset mit Offset 00:00:00; Statusänderung von input_boolean.nachtmodus auf on; Statusänderung von binary_sensor.front_door_person_2, binary_sensor.front_door_verweilen_area_1_person_2 auf on; Statusänderung von binary_sensor.front_door_person_2, binary_sensor.front_door_verweilen_area_1_person_2 auf off für 00:01:00
# WAS:  Die Automation führt `light.turn_on`, `light.turn_off` aus (mit verzweigten Bedingungen, mit Warte-/Verzögerungsschritten).
# ANPASSEN: Alle Entity-, Area-, Device- und Browser-IDs an dein Setup anpassen.
# ABHÄNGIGKEITEN (Auszug): `input_boolean.nachtmodus`, `binary_sensor.front_door_person_2`, `binary_sensor.front_door_verweilen_area_1_person_2`, `light.turn_on`, `light.garten_spots_eingang`, `light.turn_off`
# HINWEIS: Geräte-/Browser-IDs und private URLs wurden für GitHub neutralisiert.
# ============================================================================
- id: spots_eingang_automatik
  alias: Spots Eingang Automatik
  description: Abends an, Nachtmodus aus, Person wieder an
  triggers:
  - trigger: sun
    event: sunset
    offset: 00:00:00
    id: sunset
  - trigger: state
    entity_id: input_boolean.nachtmodus
    to: 'on'
    id: nachtmodus_on
  - trigger: state
    entity_id:
    - binary_sensor.front_door_person_2
    - binary_sensor.front_door_verweilen_area_1_person_2
    to: 'on'
    id: person
  - trigger: state
    entity_id:
    - binary_sensor.front_door_person_2
    - binary_sensor.front_door_verweilen_area_1_person_2
    to: 'off'
    for: 00:01:00
    id: person_weg
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      sequence:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.garten_spots_eingang
        data: {}
    - conditions:
      - condition: trigger
        id: nachtmodus_on
      sequence:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.garten_spots_eingang
        data: {}
    - conditions:
      - condition: trigger
        id: person
      - condition: state
        entity_id: input_boolean.nachtmodus
        state: 'on'
      - condition: sun
        before: sunrise
        after: sunset
      sequence:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id: light.garten_spots_eingang
        data: {}
    - conditions:
      - condition: trigger
        id: person_weg
      - condition: state
        entity_id: input_boolean.nachtmodus
        state: 'on'
      sequence:
      - delay:
          hours: 0
          minutes: 2
          seconds: 0
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.garten_spots_eingang
        data: {}
  mode: single
