# ============================================================================
# Küche Arbeitsplatte
# ----------------------------------------------------------------------------
# WANN: Geräteereignis (mqtt: action)
# WAS:  Die Automation führt `light.turn_off`, `light.turn_on` aus (mit verzweigten Bedingungen).
# ANPASSEN: Alle Entity-, Area-, Device- und Browser-IDs an dein Setup anpassen.
# ABHÄNGIGKEITEN (Auszug): `light.is_on`, `light.kuche_kuche_arbeitsplatte_rechts`, `light.turn_off`, `light.kuche_kuche_arbeitsplatte_links`, `light.is_off`, `light.turn_on`
# HINWEIS: Geräte-/Browser-IDs und private URLs wurden für GitHub neutralisiert.
# ============================================================================
- id: '1785097374147'
  alias: Küche Arbeitsplatte
  description: Schaltet die Arbeitsplattenbeleuchtung nur noch per Down-Taster des
    Aqara H2, nicht mehr per Präsenzsensor.
  triggers:
  - domain: mqtt
    device_id: REPLACE_WITH_DEVICE_OR_CONFIG_ENTRY_ID_01
    type: action
    subtype: single_down
    trigger: device
    id: buttonpress
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - buttonpress
      sequence:
      - choose:
        - conditions:
          - condition: light.is_on
            target:
              entity_id: light.kuche_kuche_arbeitsplatte_rechts
            options:
              behavior: any
          sequence:
          - action: light.turn_off
            metadata: {}
            target:
              device_id: REPLACE_WITH_DEVICE_OR_CONFIG_ENTRY_ID_02
              entity_id: light.kuche_kuche_arbeitsplatte_links
            data: {}
        - conditions:
          - condition: light.is_off
            target:
              device_id: REPLACE_WITH_DEVICE_OR_CONFIG_ENTRY_ID_02
              entity_id: light.kuche_kuche_arbeitsplatte_links
            options:
              behavior: any
          sequence:
          - action: light.turn_on
            metadata: {}
            target:
              device_id: REPLACE_WITH_DEVICE_OR_CONFIG_ENTRY_ID_02
              entity_id: light.kuche_kuche_arbeitsplatte_links
            data: {}
  mode: single
