# ============================================================================
# Schlafzimmer Abends
# ----------------------------------------------------------------------------
# WANN: Statusänderung von binary_sensor.schlafzimmer_presence_presence auf on; Statusänderung von binary_sensor.schlafzimmer_presence_presence auf off; illuminance.crossed_threshold bei sensor.schlafzimmer_presence_illuminance
# WAS:  Die Automation führt `scene.turn_on`, `light.turn_off` aus (mit verzweigten Bedingungen).
# ANPASSEN: Alle Entity-, Area-, Device- und Browser-IDs an dein Setup anpassen.
# ABHÄNGIGKEITEN (Auszug): `binary_sensor.schlafzimmer_presence_presence`, `sensor.schlafzimmer_presence_illuminance`, `input_boolean.nachtmodus`, `scene.turn_on`, `scene.schlafzimmer_abends`, `input_boolean.schlafzimmer_nacht_phase`, `light.turn_off`, `light.schlafzimmer_sideboard`
# HINWEIS: Geräte-/Browser-IDs und private URLs wurden für GitHub neutralisiert.
# ============================================================================
- id: '1785266923866'
  alias: Schlafzimmer Abends
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.schlafzimmer_presence_presence
    to:
    - 'on'
    id: 'on'
  - trigger: state
    entity_id:
    - binary_sensor.schlafzimmer_presence_presence
    to:
    - 'off'
    id: 'off'
  - trigger: illuminance.crossed_threshold
    target:
      entity_id:
      - sensor.schlafzimmer_presence_illuminance
    options:
      threshold:
        type: above
        value:
          active_choice: number
          number: 30
      for:
        hours: 0
        minutes: 5
        seconds: 0
      behavior: each
    id: bright
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'on'
      - condition: illuminance.is_value
        target:
          entity_id:
          - sensor.schlafzimmer_presence_illuminance
        options:
          behavior: any
          for: 00:00:00
          threshold:
            type: below
            value:
              active_choice: number
              number: 20
      - condition: state
        entity_id: binary_sensor.schlafzimmer_presence_presence
        state:
        - 'on'
      - condition: state
        entity_id: input_boolean.nachtmodus
        state: 'off'
      sequence:
      - action: scene.turn_on
        metadata: {}
        data:
          transition: 2
        target:
          entity_id:
          - scene.schlafzimmer_abends
    - conditions:
      - condition: trigger
        id:
        - 'off'
        - bright
      - condition: state
        entity_id: binary_sensor.schlafzimmer_presence_presence
        state:
        - 'off'
      - condition: state
        entity_id: input_boolean.schlafzimmer_nacht_phase
        state: 'off'
      sequence:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.schlafzimmer_sideboard
        data: {}
  mode: single
